# Sınıflarım'dan "E2E 6/A" sınıfını açar (satırın erişilebilirlik metni "E2E 6/A, 5 öğrenci, …").
appId: com.ulas.teacherapp
---
- scrollUntilVisible:
    element:
      text: "E2E 6/A,.*"
    visibilityPercentage: 50
    timeout: 15000
- tapOn: "E2E 6/A,.*"
- extendedWaitUntil:
    visible:
      id: "class-students-row"
    timeout: 20000
