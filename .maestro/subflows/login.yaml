# Giriş ekranından ${EMAIL} / ${PASSWORD} ile giriş yapar ve Sınıflarım'ı bekler.
appId: com.ulas.teacherapp
---
- tapOn:
    id: "login-email"
- eraseText: 60
- inputText: ${EMAIL}
- tapOn: "Şifreyi göster"
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
# hideKeyboard yerine (iOS 27'de güvenilir değil, bkz. auth.yaml) açıklama metnine dokunulur.
- tapOn: "Yoklama ve ödev kontrolü, ders arasında birkaç dokunuşla."
# Klavye kapanırken düzen kayar; eski konuma dokunmamak için animasyon beklenir.
- waitForAnimationToEnd
- tapOn:
    id: "login-submit"
- runFlow: dismiss-save-password.yaml
- extendedWaitUntil:
    visible:
      id: "classes-list"
    timeout: 30000
