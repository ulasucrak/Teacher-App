# Form türleri 1/2: test hesabı (yoksa açılır), "7/F" sınıfı, Yoklama + Artı / eksi formları.
appId: com.ulas.teacherapp
name: form-modes-setup
env:
  EMAIL: test+formmodes@ornek.com
  PASSWORD: Test1234!
---
- runFlow: subflows/launch.yaml
- runFlow:
    when:
      visible:
        id: "classes-list"
    file: subflows/sign-out.yaml
- tapOn:
    id: "login-register"
- extendedWaitUntil:
    visible:
      id: "register-screen"
    timeout: 10000
- tapOn:
    id: "register-name"
- inputText: "Form Deneme"
- tapOn:
    id: "register-email"
- inputText: ${EMAIL}
- tapOn: "Şifreyi göster"
- tapOn:
    id: "register-password"
- inputText: ${PASSWORD}
# iOS 27 simülatöründe hideKeyboard güvenilir değil (donanım klavyesi bağlıyken yazılım klavyesi
# görünmese de XCUITest "Keyboard" öğesini var sayar, Maestro "Couldn't hide the keyboard" der).
# Bunun yerine dokunulamayan açıklama metnine dokunulur: Screen'in ScrollView'ı
# (keyboardShouldPersistTaps="handled") klavyeyi kapatır, klavye yoksa etkisizdir.
- tapOn: "Sınıflarınız ve kayıtlarınız bu hesapta saklanır."
# Klavye kapanırken düzen kayar; eski konuma dokunmamak için animasyon beklenir.
- waitForAnimationToEnd
- tapOn:
    id: "register-submit"
- extendedWaitUntil:
    visible:
      id: "classes-list|register-done"
    timeout: 30000
- runFlow: subflows/dismiss-save-password.yaml
- takeScreenshot: fm-01-after-register
