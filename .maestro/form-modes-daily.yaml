# Günlük form (Yoklama): sınıf ekranından sekmeli açılır, İşaretle'de doğrudan işaretlenip
# kaydedilir; dün; Geçmiş'te Gün görünümü (günlük inceleme), takvim, liste.
appId: com.ulas.teacherapp
name: form-modes-daily
env:
  EMAIL: test+formmodes@ornek.com
  PASSWORD: Test1234!
---
- runFlow: subflows/ensure-login.yaml
- tapOn: "7/F,.*"
- extendedWaitUntil:
    visible:
      id: "class-students-row"
    timeout: 20000
- tapOn: "Yoklama,.*"
- extendedWaitUntil:
    visible:
      id: "student-row-0"
    timeout: 20000
- assertVisible:
    id: "form-tab-mark"
    selected: true
- takeScreenshot: fm2-01-daily-mark
- tapOn:
    id: "bulk-geldi"
- tapOn:
    id: "student-row-1-gelmedi"
- tapOn:
    id: "save-button"
- extendedWaitUntil:
    visible: "Kaydedildi"
    timeout: 15000
- takeScreenshot: fm2-02-daily-saved
# Dün
- tapOn:
    id: "fill-day-prev"
- extendedWaitUntil:
    visible:
      id: "student-row-0"
    timeout: 15000
- tapOn:
    id: "student-row-0-izinli"
- tapOn:
    id: "student-row-2-gec_geldi"
- takeScreenshot: fm2-03-daily-yesterday
- tapOn:
    id: "save-button"
- extendedWaitUntil:
    visible: "Kaydedildi"
    timeout: 15000
# Geçmiş > Gün
- tapOn:
    id: "form-tab-history"
- tapOn:
    id: "history-view-day"
- extendedWaitUntil:
    visible:
      id: "day-totals"
    timeout: 15000
- takeScreenshot: fm2-04-day-today
- tapOn:
    id: "review-day-prev"
- extendedWaitUntil:
    visible: "Dün, .*"
    timeout: 10000
- takeScreenshot: fm2-05-day-yesterday
- tapOn:
    id: "review-day-pick"
- extendedWaitUntil:
    visible:
      id: "calendar-title"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: fm2-06-calendar
