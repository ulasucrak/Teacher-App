# Birikimli form (Artı / eksi): işaret, geri alma, Geçmiş > Gün / Özet / Liste.
appId: com.ulas.teacherapp
name: form-modes-repeatable
env:
  EMAIL: test+formmodes@ornek.com
  PASSWORD: Test1234!
---
- runFlow: subflows/ensure-login.yaml
- tapOn: "7/F,.*"
- extendedWaitUntil:
    visible:
      id: "class-students-row"
    timeout: 20000
- tapOn: "Artı / eksi,.*"
- extendedWaitUntil:
    visible:
      id: "mark-row-0"
    timeout: 20000
- tapOn:
    id: "mark-row-3-arti"
- tapOn:
    id: "mark-row-3-arti"
- tapOn:
    id: "mark-row-4-eksi"
- takeScreenshot: fm2-07-repeatable-mark
- tapOn:
    id: "form-tab-history"
- tapOn:
    id: "history-view-day"
- extendedWaitUntil:
    visible:
      id: "day-totals"
    timeout: 15000
- takeScreenshot: fm2-08-repeatable-day
- tapOn:
    id: "history-view-summary"
- extendedWaitUntil:
    visible:
      id: "summary-totals"
    timeout: 15000
- tapOn:
    id: "range-chip"
- extendedWaitUntil:
    visible:
      id: "range-apply"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: fm2-09-range-sheet
