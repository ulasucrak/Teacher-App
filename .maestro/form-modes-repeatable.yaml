# Birikimli form (Artı / eksi): tek dokunuşla işaret, geri alma, Geçmiş'te özet ve zaman çizelgesi.
appId: com.ulas.teacherapp
name: form-modes-repeatable
env:
  EMAIL: test+formmodes@ornek.com
  PASSWORD: Test1234!
---
- runFlow: subflows/ensure-login.yaml
- tapOn: "7/F,.*"
- extendedWaitUntil:
    visible:
      id: "class-students-row"
    timeout: 20000
- tapOn: "Artı / eksi,.*"
- extendedWaitUntil:
    visible:
      id: "mark-row-0"
    timeout: 20000
- takeScreenshot: fm-09-mark-empty
- tapOn:
    id: "mark-row-0-arti"
- tapOn:
    id: "mark-row-0-arti"
- tapOn:
    id: "mark-row-0-eksi"
- tapOn:
    id: "mark-row-1-arti"
- tapOn:
    id: "mark-row-1-arti"
- tapOn:
    id: "mark-row-1-arti"
- takeScreenshot: fm-10-mark-counts
- tapOn:
    id: "mark-row-1-undo"
- extendedWaitUntil:
    visible: "Artı geri alındı"
    timeout: 10000
- takeScreenshot: fm-11-mark-undone
- tapOn:
    id: "mark-row-2-eksi"
- tapOn:
    id: "form-tab-history"
- extendedWaitUntil:
    visible:
      id: "summary-totals"
    timeout: 15000
- takeScreenshot: fm-12-summary
- tapOn:
    id: "summary-sort-score"
- takeScreenshot: fm-13-summary-by-net
- tapOn:
    id: "history-view-timeline"
- extendedWaitUntil:
    visible:
      id: "timeline-list"
    timeout: 15000
- takeScreenshot: fm-14-timeline
