<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>%WEB_TITLE%</title>
    <!-- react-native-web önerilen kök stilleri: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #ffffff;
      }
      /* Kaydırmayı ScrollView yönetir. */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Telefon tarayıcısında dokunma: gri vurgu ve çift dokunma gecikmesi olmasın. */
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      [role='button'],
      [role='radio'],
      [role='checkbox'],
      [role='tab'] {
        touch-action: manipulation;
      }
      /* Klavye odağı (v3): tüm etkileşimli öğelerde aynı 3 px pano-mavisi halka, kurşun çerçevenin 2 px dışında
         (sert gölgeyi ve çerçeveyi örtmez). Mavi panoda (Board, data-board) halka sarıdır.
         Metin alanları kendi mavi sert gölgesiyle odağı gösterir (TextField / SearchField). */
      [tabindex]:focus-visible {
        outline: 3px solid #2d3a8c;
        outline-offset: 2px;
      }
      [data-board] [tabindex]:focus-visible {
        outline-color: #ffd23f;
      }
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>Sınıf Defteri'ni kullanmak için tarayıcınızda JavaScript'i açın.</noscript>
    <div id="root"></div>
  </body>
</html>
