<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>%WEB_TITLE%</title>
    <!-- react-native-web önerilen kök stilleri: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #ffffff;
      }
      /* Kaydırmayı ScrollView yönetir; sayfa lastik gibi esnemez. */
      html,
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Genel web cilası. Renkler src/theme/colors.ts ile aynıdır:
      kağıt #FFFFFF (zemin), sıra #F2F3F5 (masaüstü sayfa zemini), kurşun #1D2129, tükenmez #2446B0 (odak).
    -->
    <style id="app-global">
      html {
        color-scheme: light;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Uygulama metni tema fontlarını (Bricolage / Atkinson, iOS ile aynı) kullanır; burası
         yalnızca font yüklenmeden önce ya da stilsiz öğelerde iOS sistem yazısına düşer. */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        color: #1d2129;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* Odak: fareyle tıklamada halka yok; klavyeyle gezinmede uygulama renginde halka. */
      :focus:not(:focus-visible) {
        outline: none !important;
      }
      :focus-visible {
        outline: 2px solid #2446b0 !important;
        outline-offset: 2px;
      }
      /* Giriş alanları kendi odak kenarını çizer (TextField); tarayıcı halkası çift görünür. */
      input:focus,
      input:focus-visible,
      textarea:focus,
      textarea:focus-visible {
        outline: none !important;
      }

      /* Dokunulabilir öğeler: el imleci, metin seçimi yok (iOS'taki gibi). */
      [role='button'],
      [role='link'],
      [role='tab'],
      [role='radio'],
      [role='checkbox'],
      [role='switch'],
      [role='menuitem'],
      [role='option'],
      a,
      button {
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
      }
      [role='button'] *,
      [role='link'] *,
      [role='tab'] *,
      [role='radio'] *,
      [role='checkbox'] *,
      [role='switch'] *,
      [role='menuitem'] *,
      [role='option'] * {
        -webkit-user-select: none;
        user-select: none;
      }
      [aria-disabled='true'],
      [aria-disabled='true'] * {
        cursor: default;
      }
      input,
      textarea,
      [contenteditable='true'] {
        -webkit-user-select: text !important;
        user-select: text !important;
        cursor: text;
      }

      /* İnce, zemine karışan kaydırma çubukları (macOS bindirme çubuklarına benzer). */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(29, 33, 41, 0.22) transparent;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
        background: transparent;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(29, 33, 41, 0.22);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(29, 33, 41, 0.38);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* Fareyle üstüne gelme / basma geri bildirimi (Pressable stilleri) yumuşak geçsin. */
      [role='button'],
      [role='radio'],
      [role='tab'],
      [role='checkbox'],
      [role='switch'] {
        transition:
          background-color 100ms ease-out,
          filter 100ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        [role='button'],
        [role='radio'],
        [role='tab'],
        [role='checkbox'],
        [role='switch'] {
          transition: none;
        }
      }

      /* Masaüstü çerçevesi — sayılar src/components/ui/AppFrame.web.tsx (appFrame) ile aynı:
         sütun 520px, çerçeve ≥600px genişlikte, yüzen kart (24px boşluk, 28px köşe) ≥720px yükseklikte.
         RN Modal'lar (Sheet, AlertDialog) body'ye taşınır ve tüm pencereyi kaplar: perde bütün
         sayfayı karartır; Sheet paneli kendini AppFrame.web.tsx `overlayColumnStyle` ile sütuna
         yerleştirir (burada modal kutusu sütuna sıkıştırılmaz). */
      @media (min-width: 600px) {
        html,
        body {
          background-color: #f2f3f5;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Sınıf Defteri'ni kullanmak için tarayıcınızda JavaScript'i açın.</noscript>
    <div id="root"></div>
  </body>
</html>
