<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>%WEB_TITLE%</title>
    <!-- react-native-web önerilen kök stilleri: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #ffffff;
      }
      /* Kaydırmayı ScrollView yönetir. */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Sınıf Defteri'ni kullanmak için tarayıcınızda JavaScript'i açın.</noscript>
    <div id="root"></div>
  </body>
</html>
