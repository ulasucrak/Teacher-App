<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>%WEB_TITLE%</title>
    <!-- react-native-web önerilen kök stilleri: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #ffffff;
      }
      /* Kaydırmayı ScrollView yönetir. */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Telefon tarayıcısında dokunma: gri vurgu ve çift dokunma gecikmesi olmasın. */
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      [role='button'],
      [role='radio'],
      [role='checkbox'],
      [role='tab'] {
        touch-action: manipulation;
      }
      /* Klavye odağı: tüm etkileşimli öğelerde aynı 2 px mavi (tükenmez) halka; içeri alınır, kırpılmaz.
         Metin alanları kendi kenarıyla odağı gösterir (TextField / SearchField). */
      [tabindex]:focus-visible {
        outline: 2px solid #2446b0;
        outline-offset: -2px;
      }
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>Sınıf Defteri'ni kullanmak için tarayıcınızda JavaScript'i açın.</noscript>
    <div id="root"></div>
  </body>
</html>
